[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo", "php82Extensions.pdo_pgsql", "php82Extensions.mbstring", "php82Extensions.xml", "php82Extensions.curl", "php82Extensions.zip", "php82Extensions.gd", "nodejs_20", "nodePackages.npm"]
aptPkgs = ["libgd-dev"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-scripts --no-interaction",
  "npm ci",
  "npm run build"
]

[start]
cmd = "php artisan config:cache && php artisan view:cache && php artisan migrate --force && php artisan db:seed --class=ProductionBaselineSeeder --force && php artisan serve --host=0.0.0.0 --port=$PORT"
